<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) {}
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} &middot; {{ end }}{{ site.Title }}</title>
  {{ partial "head.html" . }}
</head>
<body class="min-h-screen bg-surface-page text-primary font-body antialiased flex flex-col">
  {{ partial "header.html" . }}
  <main class="flex-1 w-full px-6 lg:px-[var(--page-margin)]">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
  (function () {
    function apply(theme) {
      document.documentElement.dataset.theme = theme;
      document.querySelectorAll('[data-theme-toggle-label]').forEach(function (el) {
        el.textContent = theme === 'dark' ? 'Light' : 'Dark';
      });
    }
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-theme-toggle]');
      if (!btn) return;
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('theme', next); } catch (e) {}
      apply(next);
    });
    apply(document.documentElement.dataset.theme || 'light');
  })();
  </script>
</body>
</html>
