<header class="w-full px-6 py-6 lg:px-[var(--page-margin)] lg:py-8 flex items-center justify-between gap-4">
  <a href="{{ "/" | relURL }}" class="font-display text-lg text-primary no-underline">{{ site.Title }}</a>
  <nav class="flex flex-wrap items-center gap-3">
    {{- range site.Menus.main }}
    {{ partial "button.html" (dict "variant" "ghost" "href" .URL "text" .Name) }}
    {{- end }}
    {{ partial "theme-toggle.html" . }}
  </nav>
</header>
