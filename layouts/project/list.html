{{ define "main" }}
<section class="max-w-[940px] mx-auto py-16">
  <h1 class="font-body font-medium text-4xl text-primary mb-8">{{ .Title }}</h1>
  <div class="grid gap-6">
    {{- range .Pages.ByDate.Reverse }}
    {{ partial "articlecard.html" (dict "title" .Title "date" .Date "summary" (.Params.summary | default .Summary) "tags" .Params.tags "href" .RelPermalink "cta" "View project") }}
    {{- end }}
  </div>
</section>
{{ end }}
